[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-portfolio-bot"
version = "0.1.0"
description = "Telegram bot for logging securities purchases (/buy TICKER QTY PRICE)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["telegram", "bot", "trading", "portfolio", "logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "custom-python-logger>=2.0.13",
    "python-custom-exceptions>=0.0.2",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
bot = "trade_portfolio_bot.bot.app:main"

[project.urls]
Homepage = "https://github.com/aviz92/trade-portfolio-bot"
Repository = "https://github.com/aviz92/trade-portfolio-bot"
Issues = "https://github.com/aviz92/trade-portfolio-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["trade_portfolio_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
